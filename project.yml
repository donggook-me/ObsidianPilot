name: ObsidianPilot
options:
  bundleIdPrefix: com.obsidianpilot
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

targets:
  ObsidianPilot:
    type: application
    platform: macOS
    sources:
      - ObsidianPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsidianpilot.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ObsidianPilot/Info.plist
        CODE_SIGN_ENTITLEMENTS: ObsidianPilot/ObsidianPilot.entitlements
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
